media:
  input: public/media
  output: /media

content:
  - name: posts
    label: Articles
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{slug}.md"
    view:
      fields: [title, date, category]
      primary: title
      sort: date
      sort_order: desc
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: category
        label: Category
        type: string
      - name: excerpt
        label: Excerpt
        type: text
      - name: body
        label: Article
        type: rich-text
    operations:
      create: true
      rename: true
      delete: true

settings:
  commit:
    message: "Update Nōte content"
